<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>活动记录 | 汤包的生活手记</title>
  <link rel="stylesheet" href="assets/css/style.css?v=8" />
  <link rel="stylesheet" href="assets/css/activities.css?v=5" />
</head>
<body class="activities-page">
  <div class="click-layer" id="clickLayer"></div>
  <header class="page-hero">
    <nav class="navbar">
      <a class="logo" href="index.html" aria-label="汤包的生活手记 · 个人主页"><strong>汤包的生活手记</strong><small>菠萝汤包scho · 个人主页</small></a>
      <div class="nav-links">
        <a href="index.html">个人主页</a>
        <a href="rank/">图片榜单</a>
        <a href="activities.html" aria-current="page">活动记录</a>
        <a href="sports.html">体育</a>
        <a href="art.html">艺术</a>
        <a href="anime.html">二次元</a>
        <a href="travel.html">旅行</a>
      </div>
    </nav>
    <div class="page-hero-content">
      <p class="eyebrow">LIFE / MEMORIES</p><h1 id="activities-title">活动记录</h1>
      <p class="page-hero-text" id="activities-description">把到过的现场、参加过的活动，收进一份生活相册。</p>
      <div class="hero-buttons"><a class="btn primary" href="#event-records">翻开活动相册 ↓</a><a class="btn secondary" href="index.html">返回个人主页</a></div>
    </div>
  </header>
  <main class="detail-main">
    <section class="event-section" id="event-records" aria-labelledby="event-section-title">
      <header class="event-section-header">
        <div><span class="event-kicker">LIFE / MEMORIES</span><h2 id="event-section-title">那些到场的日子</h2><p>参加过的活动，照片和视频都收在这里。</p></div>
        <div class="event-tally" aria-label="活动素材总数"><span><strong id="event-total">—</strong>场记录</span><span><strong id="event-photos">—</strong>张照片</span><span><strong id="event-videos">—</strong>段视频</span></div>
      </header>
      <p id="event-loading" class="event-status" role="status">正在翻开活动相册…</p>
      <div id="event-index" hidden>
        <nav class="event-filters event-type-tabs" id="event-filters" aria-label="活动形式"></nav>
        <div class="event-toolbar">
          <label id="event-topic-control">主题标签<select id="event-topic"><option value="">全部主题</option><option value="acg">二次元</option><option value="sports">体育</option><option value="art">艺术</option><option value="travel">旅行</option><option value="life">生活</option><option value="other">其他</option></select></label>
          <label>参加年份<select id="event-year"><option value="">全部年份</option></select></label>
        </div>
        <p id="event-result" class="event-result" role="status"></p>
        <div class="event-grid" id="event-grid"></div>
      </div>
      <div id="event-album" hidden>
        <div class="event-album-actions"><a href="#event-records" class="event-back">← 返回全部活动记录</a><button type="button" id="event-share" class="event-share-button">复制活动链接</button></div>
        <p id="event-share-status" class="event-share-status" role="status" aria-live="polite"></p>
        <label id="event-share-fallback" class="event-share-fallback" hidden>活动链接<input id="event-share-url" type="text" readonly /></label>
        <header class="event-album-heading"><span class="event-kicker" id="event-album-category"></span><h3 id="event-album-title" tabindex="-1"></h3><p id="event-album-meta"></p><p>点击照片放大，点击视频封面播放。</p></header>
        <p id="event-album-note" hidden></p>
        <div class="event-media-grid" id="event-media-grid"></div>
      </div>
      <noscript>请启用 JavaScript，以浏览活动照片与视频。</noscript>
    </section>
    <dialog class="event-dialog" id="event-dialog" aria-label="活动素材查看器">
      <button type="button" class="event-dialog-close" id="event-close" aria-label="关闭照片或视频">×</button>
      <div class="event-dialog-body" id="event-dialog-body"></div>
      <div class="event-dialog-controls"><button type="button" id="event-previous" aria-label="上一个素材">← 上一个</button><span id="event-position" role="status"></span><button type="button" id="event-next" aria-label="下一个素材">下一个 →</button></div>
    </dialog>

  </main>
  <footer><p>© 2026 菠萝汤包scho · 汤包的生活手记 · 活动记录</p></footer>
  <script src="assets/js/script.js?v=9"></script>
  <script type="module" src="assets/js/activities.js?v=8"></script>
  <script src="assets/js/site-console.js?v=11" defer></script>
</body>
</html>
