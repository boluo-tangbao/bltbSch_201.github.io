name: Deploy personal site and ranking to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  rank-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate ranking update records
        run: node scripts/generate-rank-updates.mjs
        working-directory: rank
        env:
          RANK_BASE_SHA: ${{ github.event.before }}
      - name: Commit generated ranking records
        id: commit
        run: |
          if ! git diff --quiet -- rank/src/data/places.json rank/src/data/updates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rank/src/data/places.json rank/src/data/updates.json
            git commit -m "Record automatic ranking updates"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: rank-updates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.rank-updates.outputs.commit_sha }}
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rank/package-lock.json
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
        working-directory: rank
      - run: npm test
        working-directory: rank
      - name: Validate, typecheck, and build ranking
        run: npm run build
        working-directory: rank
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/rank/
          VITE_BAIDU_MAP_AK: ${{ secrets.BAIDU_MAP_AK }}
          VITE_BAIDU_MAP_PROXY_URL: ${{ secrets.BAIDU_MAP_PROXY_URL }}
      - name: Restore generated activity media cache
        uses: actions/cache@v4
        with:
          path: assets/generated/activities/media
          key: activities-v1-${{ runner.os }}-${{ hashFiles('content/activities/**', 'scripts/prepare-activities.mjs') }}
          restore-keys: activities-v1-${{ runner.os }}-
      - run: node scripts/assemble-site.mjs
      - name: Install activity browser checker
        run: npx playwright install --with-deps chromium
        working-directory: rank
      - name: Verify main site and activities
        run: node scripts/verify-activities.mjs
        env:
          PLAYWRIGHT_CHANNEL: chromium
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
