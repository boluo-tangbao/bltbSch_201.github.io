name: Deploy personal site and ranking to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rank/package-lock.json
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
        working-directory: rank
      - run: npm test
        working-directory: rank
      - name: Validate, typecheck, and build ranking
        run: npm run build
        working-directory: rank
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/rank/
          VITE_BAIDU_MAP_AK: ${{ secrets.BAIDU_MAP_AK }}
          VITE_BAIDU_MAP_PROXY_URL: ${{ secrets.BAIDU_MAP_PROXY_URL }}
      - run: node scripts/assemble-site.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
